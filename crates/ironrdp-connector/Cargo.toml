[package]
name = "ironrdp-connector"
version = "0.12.0"
readme = "README.md"
description = "State machines to drive an RDP connection sequence"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = false
test = false

[features]
default = []
__test = []
qoi = ["ironrdp-pdu/qoi"]
qoiz = ["ironrdp-pdu/qoiz"]
remote-guard = ["dep:ironrdp-dvc", "dep:ironrdp-rdpear", "sspi/dns_resolver"]

[dependencies]
ironrdp-svc = { path = "../ironrdp-svc", version = "0.10" } # public
ironrdp-core = { path = "../ironrdp-core", version = "0.3" } # public
ironrdp-error = { path = "../ironrdp-error", version = "0.2" } # public
ironrdp-pdu = { path = "../ironrdp-pdu", version = "0.11", features = ["std"] } # public
sspi = "0.23.1" # public
ironrdp-dvc = { path = "../ironrdp-dvc", version = "0.10", optional = true } # public
ironrdp-rdpear = { path = "../ironrdp-rdpear", version = "0.1", optional = true }
url = "2.5" # public
rand = { version = "0.9", features = ["std"] } # TODO: dependency injection?
tracing = { version = "0.1", features = ["log"] }
serde_json = "1"

[lints]
workspace = true
